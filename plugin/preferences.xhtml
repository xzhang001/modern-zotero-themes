<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="mzt-preferences" onload="window.MZTPreferences.init()">
  <groupbox>
    <html:header class="mzt-hero">
      <html:h2 data-mzt-text="heading">Make room for your research.</html:h2>
    </html:header>

    <html:section class="mzt-section" aria-labelledby="mzt-theme-heading">
      <html:div class="mzt-section-head">
        <html:h3 id="mzt-theme-heading" data-mzt-text="themes">Theme</html:h3>
        <html:div class="mzt-seg" data-key="mode" role="radiogroup" aria-labelledby="mzt-theme-heading">
          <html:button type="button" role="radio" data-value="fixed" data-mzt-text="fixed">Fixed</html:button>
          <html:button type="button" role="radio" data-value="system" data-mzt-text="system">Match system</html:button>
        </html:div>
      </html:div>
      <html:div id="mzt-theme-cards" role="group" aria-labelledby="mzt-theme-heading"/>
      <html:div id="mzt-appearance-notice" hidden="hidden">
        <html:span class="mzt-notice-icon" aria-hidden="true">i</html:span>
        <html:p id="mzt-appearance-message"/>
        <html:button id="mzt-appearance-fix" type="button"/>
      </html:div>
    </html:section>

    <html:section class="mzt-section" aria-labelledby="mzt-page-heading">
      <html:div class="mzt-section-head">
        <html:h3 id="mzt-page-heading" data-mzt-text="page">Reading page</html:h3>
      </html:div>
      <html:div id="mzt-page-options" role="radiogroup" aria-labelledby="mzt-page-heading" aria-describedby="mzt-page-hint"/>
      <html:p id="mzt-page-hint" class="mzt-hint"/>
    </html:section>

    <html:section class="mzt-section" aria-labelledby="mzt-interface-heading">
      <html:div class="mzt-section-head">
        <html:h3 id="mzt-interface-heading" data-mzt-text="interface">Interface</html:h3>
      </html:div>
      <html:div class="mzt-list">
        <html:div class="mzt-row">
          <html:span id="mzt-layout-label" class="mzt-row-title" data-mzt-text="layout">Layout</html:span>
          <html:div class="mzt-seg" data-key="layout" role="radiogroup" aria-labelledby="mzt-layout-label">
            <html:button type="button" role="radio" data-value="modern" data-mzt-text="layoutModern">Modern</html:button>
            <html:button type="button" role="radio" data-value="classic" data-mzt-text="layoutClassic">Classic</html:button>
          </html:div>
        </html:div>
        <html:div class="mzt-row">
          <html:span id="mzt-readingProgress-label" class="mzt-row-title" data-mzt-text="readingProgress">Reading progress bar</html:span>
          <html:div class="mzt-seg" data-key="readingProgress" role="radiogroup" aria-labelledby="mzt-readingProgress-label">
            <html:button type="button" role="radio" data-value="show" data-mzt-text="progressShow">Show</html:button>
            <html:button type="button" role="radio" data-value="hide" data-mzt-text="progressHide">Hide</html:button>
          </html:div>
        </html:div>
        <html:div class="mzt-row" data-modern-only="true">
          <html:span id="mzt-emptyFields-label" class="mzt-row-title" data-mzt-text="emptyFields">Empty fields</html:span>
          <html:div class="mzt-seg" data-key="emptyFields" role="radiogroup" aria-labelledby="mzt-emptyFields-label">
            <html:button type="button" role="radio" data-value="hide" data-mzt-text="emptyHide">Hide</html:button>
            <html:button type="button" role="radio" data-value="show" data-mzt-text="emptyShow">Show</html:button>
          </html:div>
        </html:div>
        <html:div class="mzt-row" data-modern-only="true">
          <html:span id="mzt-folderIcons-label" class="mzt-row-title" data-mzt-text="folderIcons">Folder icons</html:span>
          <html:div class="mzt-seg" data-key="folderIcons" role="radiogroup" aria-labelledby="mzt-folderIcons-label">
            <html:button type="button" role="radio" data-value="color" data-mzt-text="iconsColor">Color</html:button>
            <html:button type="button" role="radio" data-value="mono" data-mzt-text="iconsMono">Monochrome</html:button>
          </html:div>
        </html:div>
      </html:div>
    </html:section>

    <html:footer class="mzt-footer">
      <html:p id="mzt-status" role="status" aria-live="polite"/>
    </html:footer>
  </groupbox>
</vbox>
